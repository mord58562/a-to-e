name = "a-to-e-inbox"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Public-facing vars (non-secret). Set GITHUB_TOKEN via
#   npx wrangler secret put GITHUB_TOKEN
[vars]
GITHUB_OWNER  = "mord58562"
GITHUB_REPO   = "a-to-e"
GITHUB_BRANCH = "main"
ALLOW_ORIGIN  = "https://mord58562.github.io"

# D1 database binding (accounts + answer aggregates).
# Create the DB once with `npx wrangler d1 create a-to-e`, paste the printed
# database_id below, then apply schema.sql and every schema_0*.sql in order
# (README.md, One-time setup).
[[d1_databases]]
binding       = "DB"
database_name = "a-to-e"
database_id   = "ba7b0559-98e5-4df1-b72d-780ae458626c"

# Nightly sweep of expired sessions and the rate-limit ledger. See the
# `scheduled` export in src/worker.js.
[triggers]
crons = ["17 15 * * *"]
